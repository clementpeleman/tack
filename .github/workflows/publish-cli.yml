name: Publish CLI

# Publishes @usetack/cli to npm with provenance when a tag like cli-v0.1.1 is
# pushed. The version in packages/cli/package.json must match the tag.
on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#cli-v}"
          pkg=$(node -p "require('./packages/cli/package.json').version")
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package.json $pkg" >&2; exit 1; }
      - run: pnpm --filter @usetack/cli publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
